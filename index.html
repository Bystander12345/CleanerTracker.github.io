<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classroom Cleanliness Tracker</title>
<meta name="description" content="Live weekly classroom cleanliness tracker: daily cleaner checklist, daily and weekly completion progress, automatic weekly reset.">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cleaner Track">
<meta property="og:title" content="Classroom Cleanliness Tracker">
<meta property="og:description" content="Live daily checklists and weekly progress for our classroom cleaning crew.">
<meta name="robots" content="index, follow">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#14213d;--mut:#62708b;--line:#e2e7f1;--brand:#2563eb;--ok:#16a34a;--warn:#d97706;--track:#e6eaf4;--soft:#eef3ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1322;--card:#161e33;--ink:#eaf0ff;--mut:#9aa8c7;--line:#26314d;--brand:#5b8cff;--ok:#34d399;--warn:#fbbf24;--track:#26314d;--soft:#1b2644}}
:root[data-theme="dark"]{--bg:#0d1322;--card:#161e33;--ink:#eaf0ff;--mut:#9aa8c7;--line:#26314d;--brand:#5b8cff;--ok:#34d399;--warn:#fbbf24;--track:#26314d;--soft:#1b2644}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 48px}
header h1{margin:0;font-size:clamp(1.5rem,4vw,2.1rem);letter-spacing:-.02em}
header p{margin:4px 0 0;color:var(--mut)}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--brand);font-size:12px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}
.hero{margin:20px 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:760px){.hero{grid-template-columns:1.4fr 1fr}}
.big{font-size:2.6rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.lbl{color:var(--mut);font-size:13px;margin-top:4px}
.bar{height:12px;background:var(--track);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--brand);border-radius:99px;transition:width .5s ease,background .3s}
.bar.ok>i{background:var(--ok)}
.meta{display:flex;flex-wrap:wrap;gap:18px;margin-top:14px;font-size:13px;color:var(--mut)}
.meta b{color:var(--ink)}
.hist{display:flex;align-items:flex-end;gap:6px;height:64px;margin-top:6px}
.hist div{flex:1;background:var(--brand);opacity:.75;border-radius:4px 4px 0 0;min-height:3px;position:relative}
.hist span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10px;color:var(--mut)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.day{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.day.today{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dh h2{margin:0;font-size:1.05rem}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--track);color:var(--mut)}
.tag.t{background:var(--brand);color:#fff}.tag.c{background:var(--ok);color:#fff}.tag.m{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.dp{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.dp .bar{flex:1;height:9px}.dp b{font-size:13px;min-width:38px;text-align:right}
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.task input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--ok);flex:none}
.task label{flex:1;min-width:0}
.rn{font-weight:600;font-size:14px}.task.done .rn{text-decoration:line-through;color:var(--mut)}
.rd{font-size:12px;color:var(--mut)}
.nm{width:100%;margin-top:4px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:5px 8px;font:inherit;font-size:13px}
.nm[readonly]{border-color:transparent;padding-left:0}
.nm:focus{outline:2px solid var(--brand);outline-offset:1px}
.note{margin-top:20px;font-size:13px;color:var(--mut);text-align:center}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s}
#toast.on{opacity:1}
.ni{padding:0 0 6px 30px;margin-top:-6px}
@media(max-width:600px){.wrap{padding:14px 12px 40px}.hero{padding:16px;margin:14px 0}.big{font-size:2.2rem}.grid{grid-template-columns:1fr}.task{padding:12px 0}.task input[type=checkbox]{width:28px;height:28px}.ni{padding-left:38px;padding-bottom:10px}.nm{font-size:16px;padding:9px 10px}.meta{gap:8px 16px}.top{align-items:flex-start}}
button,input,label{touch-action:manipulation}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="top">
<div><h1>🧹 Classroom Cleanliness Tracker</h1><p id="seo">Daily cleaning checklist with live progress and an automatic weekly reset.</p></div>
<span class="pill" id="mode"><span class="dot"></span> Live</span>
</div>
</header>

<section class="hero" aria-label="Weekly progress">
<div>
<div class="big" id="wpct">0%</div>
<div class="lbl">Week completion <span id="wrange"></span></div>
<div class="bar" id="wbar" style="margin-top:12px;height:16px"><i></i></div>
<div class="meta">
<span>Tasks done: <b id="wcount">0/20</b></span>
<span>Days complete: <b id="wdays">0/5</b></span>
<span>Resets in: <b id="reset"></b></span>
<span>Updated: <b id="upd">—</b></span>
</div>
</div>
<div>
<div class="lbl" style="margin:0">Previous weeks</div>
<div class="hist" id="hist"></div>
</div>
</section>

<main class="grid" id="app" aria-live="polite"></main>
<p class="note">Four assigned students clean the room each day. The checklist resets every Monday.</p>
</div>
<div id="toast"></div>

<script id="state" type="application/json">{"week":"","done":{},"names":{},"hist":[],"updated":""}</script>
<script>
(function(){
var DAYS=[["mon","Monday"],["tue","Tuesday"],["wed","Wednesday"],["thu","Thursday"],["fri","Friday"]];
var ROLES=[["Floor Keeper","Sweep floor, pick up litter"],["Board & Surfaces","Erase board, wipe shelves"],["Desks & Chairs","Align desks and chairs"],["Trash & Supplies","Empty bins, store supplies"]];
var S=JSON.parse(document.getElementById("state").textContent);
var CAN=false,ART=null,timer=null;
var $=function(i){return document.getElementById(i)};
function pad(n){return String(n).padStart(2,"0")}
function wk(d){d=d||new Date();var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate())}
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function dayCount(d){var n=0;for(var i=0;i<4;i++)if(S.done[d+"-"+i])n++;return n}
function total(){return DAYS.reduce(function(a,d){return a+dayCount(d[0])},0)}
function rollover(){
  var cur=wk();
  if(S.week&&S.week!==cur){S.hist=(S.hist||[]).concat([{w:S.week,p:Math.round(total()/20*100)}]).slice(-8);S.done={}}
  S.week=cur;
}
function toast(m){var t=$("toast");t.textContent=m;t.className="on";setTimeout(function(){t.className=""},2600)}
function render(){
  rollover();
  var now=new Date(),ti=(now.getDay()+6)%7;
  $("app").innerHTML=DAYS.map(function(d,di){
    var k=d[0],c=dayCount(k),p=c*25,st="Upcoming",cl="";
    if(p===100){st="Complete";cl="c"}else if(di===ti){st="Today";cl="t"}else if(di<ti||ti>4){st=p?"Incomplete":"Missed";cl="m"}
    var names=(S.names&&S.names[k])||[];
    return '<section class="day'+(di===ti?' today':'')+'"><div class="dh"><h2>'+d[1]+'</h2><span class="tag '+cl+'">'+st+'</span></div>'+
    '<div class="dp"><div class="bar'+(p===100?' ok':'')+'"><i style="width:'+p+'%"></i></div><b>'+p+'%</b></div>'+
    ROLES.map(function(r,i){var id=k+"-"+i,on=!!S.done[id];
      return '<div class="task'+(on?' done':'')+'"><input type="checkbox" id="c-'+id+'" data-k="'+id+'"'+(on?' checked':'')+(CAN?'':' disabled')+'>'+
      '<label for="c-'+id+'"><div class="rn">'+r[0]+'</div><div class="rd">'+r[1]+'</div></label></div>'+
      '<div class="ni"><input class="nm" data-d="'+k+'" data-i="'+i+'" placeholder="'+(CAN?'Assign student name':'Unassigned')+'" value="'+esc(names[i])+'"'+(CAN?'':' readonly')+' aria-label="Student for '+r[0]+' on '+d[1]+'"></div>';
    }).join('')+'</section>';
  }).join("");
  summary();
}
function summary(){
  var t=total(),p=Math.round(t/20*100),dc=DAYS.filter(function(d){return dayCount(d[0])===4}).length;
  $("wpct").textContent=p+"%";$("wcount").textContent=t+"/20";$("wdays").textContent=dc+"/5";
  var b=$("wbar");b.className="bar"+(p===100?" ok":"");b.firstElementChild.style.width=p+"%";
  var m=new Date(S.week+"T00:00:00"),f=new Date(m);f.setDate(f.getDate()+4);
  var o={month:"short",day:"numeric"};
  $("wrange").textContent="("+m.toLocaleDateString(undefined,o)+" – "+f.toLocaleDateString(undefined,o)+")";
  var nx=new Date(m);nx.setDate(nx.getDate()+7);var ms=nx-new Date(),dd=Math.floor(ms/864e5),hh=Math.floor(ms%864e5/36e5);
  $("reset").textContent=dd+"d "+hh+"h";
  $("upd").textContent=S.updated?new Date(S.updated).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"—";
  $("seo").textContent="Week of "+$("wrange").textContent.replace(/[()]/g,"")+": "+p+"% complete ("+t+" of 20 cleaning tasks done). Daily checklist with automatic weekly reset.";
  var h=(S.hist||[]).slice(-6);
  $("hist").innerHTML=h.length?h.map(function(x){return '<div style="height:'+Math.max(x.p,4)+'%" title="Week of '+x.w+': '+x.p+'%"><span>'+x.p+'%</span></div>'}).join(""):'<span class="rd">No history yet</span>';
  $("mode").innerHTML='<span class="dot"></span> '+(CAN?(window.claude?"Teacher mode · live":"Saved on this device"):"Live · view only");
}
function build(){
  S.updated=new Date().toISOString();
  var c=document.documentElement.cloneNode(true);
  c.querySelector("#app").innerHTML="";c.querySelector("#hist").innerHTML="";
  c.querySelector("#state").textContent=JSON.stringify(S).replace(/</g,"\\u003c");
  return "<!doctype html>\n"+c.outerHTML;
}
function save(){
  if(!ART)return;clearTimeout(timer);
  timer=setTimeout(function(){
    ART.publish(build()).catch(function(e){toast(e&&e.code==="conflict"?"Updated elsewhere — refreshing":"Could not save changes")});
  },900);
}
$("app").addEventListener("change",function(e){
  var k=e.target.getAttribute("data-k");if(!k||!CAN)return;
  if(e.target.checked)S.done[k]=true;else delete S.done[k];
  render();save();
});
$("app").addEventListener("input",function(e){
  var d=e.target.getAttribute("data-d");if(!d||!CAN)return;
  S.names=S.names||{};S.names[d]=S.names[d]||["","","",""];S.names[d][+e.target.getAttribute("data-i")]=e.target.value;save();
});
render();
setInterval(function(){var w=S.week;rollover();if(w!==S.week){S.updated="";render()}else summary()},30000);
if(window.claude&&claude.use){
  claude.use("artifact").then(function(a){ART=a});
  claude.use("user").then(function(u){CAN=!!(u&&u.canEdit());render()});
}else{
  /* Standalone mode (GitHub Pages etc.): saves ticks in this browser only */
  CAN=true;
  try{var L=JSON.parse(localStorage.getItem("cleanerTrack"));if(L&&L.week)S=L}catch(e){}
  ART={publish:function(){try{localStorage.setItem("cleanerTrack",JSON.stringify(S))}catch(e){}return Promise.resolve()}};
  render();
}
})();
</script>
</body>
</html>
